<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleLegends Boss 攻略 · PB / BGA</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222c; --line: #2e3a4a;
    --text: #e8eef6; --muted: #9aabbd; --pb: #ff6b9d; --bga: #5b9dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
    background:
      radial-gradient(900px 500px at 20% 0%, #3a1a2e 0%, transparent 55%),
      radial-gradient(800px 480px at 80% 10%, #152a3a 0%, transparent 50%),
      var(--bg);
    color: var(--text);
  }
  .wrap { width: min(720px, 92vw); padding: 2rem 0 3rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
  p { color: var(--muted); margin: .4rem 0 1.5rem; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.35rem 1.4rem;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { transform: translateY(-2px); }
  a.card.pb:hover { border-color: var(--pb); }
  a.card.bga:hover { border-color: var(--bga); }
  .tag { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  a.card.pb .tag { color: var(--pb); }
  a.card.bga .tag { color: var(--bga); }
  a.card h2 { margin: .35rem 0 .4rem; font-size: 1.25rem; }
  a.card p { margin: 0; font-size: .9rem; }
  .note { margin-top: 1.25rem; font-size: .85rem; color: var(--muted); }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>MapleLegends Boss 攻略</h1>
    <p>选择要看的 Boss。页内顶栏也可随时切换。</p>
    <div class="cards">
      <a class="card pb" href="pink-bean-animations-guide.html">
        <div class="tag">PB</div>
        <h2>品克缤</h2>
        <p>动画 / 鸟先鸟后 / 满编编制合并稿，资料较完整。</p>
      </a>
      <a class="card bga" href="bodyguard-a-bga-guide.html">
        <div class="tag">BGA</div>
        <h2>保镖 A</h2>
        <p>Bodyguard A：技能、pin、cleave、船长操作要点。</p>
      </a>
    </div>
    <p class="note">BGA 论坛缺少与 PB 同级的 GIF 主帖；当前页为图鉴 + 船长帖 + 2025 改版讨论整理。</p>
  </div>
</body>
</html>
